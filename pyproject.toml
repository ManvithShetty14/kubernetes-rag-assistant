[project]
name = "kubernetes-rag-assistant"
version = "0.1.0"
description = "Enterprise agentic RAG (LangGraph + Qdrant + NeMo Guardrails) behind a LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "flashrank>=0.2.10",
    "google-generativeai>=0.8.6",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.2.5",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langsmith>=0.14.17",
    "logfire[fastapi,requests]>=5.4.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.24.1",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "openai>=1.40.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.0.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pytz>=2026.6",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "unstructured>=0.27.36",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Only needed for the evaluation suite (evals/). Kept out of the production API image —
# sentence-transformers alone pulls in PyTorch (~600 MB+).
evals = [
    "deepeval>=4.3.2",
    "langfuse>=5.1.0",
    "pandas-stubs~=3.1.0",
    "ragas>=0.4.3",
    "sentence-transformers>=6.2.0",
]
# Streamlit UI (the UI container installs its own small pinned list: ui/requirements.txt)
ui = [
    "streamlit[auth]>=1.66.1",   # [auth] = built-in OIDC login (st.login)
]

[tool.uv]
# Local `uv sync` / `uv run` still installs everything, exactly as before.
# The API Docker image uses `--no-group evals --no-group ui`.
default-groups = ["evals", "ui"]
