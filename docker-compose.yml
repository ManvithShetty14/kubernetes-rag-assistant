# ==============================================================================
# Local stack — same images that run on Cloud Run.
#   Gateway + database (for `uv run uvicorn ...` development):  docker compose up -d litellm postgres
#     then set DATABASE_URL=postgresql://rag:rag@localhost:5432/rag in .env
#   Full stack (gateway + API + UI, production images):    docker compose --profile full up --build
#     UI  -> http://localhost:8501     API -> http://localhost:8000/health
# Secrets come from your local .env (never baked into images).
# ==============================================================================
services:
  litellm:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: rag-gateway:local
    container_name: litellm-gateway
    ports:
      - "4000:4000"
    volumes:
      # Local edits to the config apply after `docker compose restart litellm` (no rebuild needed)
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_FALLBACK_API_KEY: ${GROQ_FALLBACK_API_KEY:-${GROQ_API_KEY}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-key}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag          # local development only
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data   # chats survive `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: rag-api:local
    container_name: rag-api
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      LITELLM_BASE_URL: http://litellm:4000     # service name inside the compose network
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      ENVIRONMENT: docker
    depends_on:
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles: ["full"]

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: rag-ui:local
    container_name: rag-ui
    ports:
      - "8501:8080"
    env_file: .env
    environment:
      BACKEND_URL: http://api:8080
    volumes:
      # Optional Google sign-in: put secrets.toml here (see docs/DEPLOYMENT.md, section 6)
      - ./.streamlit:/app/.streamlit:ro
    depends_on:
      - api
    profiles: ["full"]

volumes:
  pgdata:
